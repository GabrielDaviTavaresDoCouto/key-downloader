plugins {
    id "com.android.application"
}

android {
    namespace "com.comikey.downloader"
    compileSdk 34

    defaultConfig {
        applicationId "com.comikey.downloader"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}